6" y="136.0669">Description</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="16" y="151.1997">Host Power On</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="159" x="218" y="151.1997">gracefulPowerOffRequest</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194" x="451" y="151.1997">Host Graceful Transition To Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="146" x="653" y="151.1997">gracefulTransitionToOff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325" x="882" y="151.1997">gracefulPowerOffTimerStart() &amp; gracefulPowerOff();</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="278" x="1215" y="151.1997">Host Graceful Shutdown Sequence Started:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="220" x="1215" y="166.3325">1. Graceful power-off timer started</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="404" x="1215" y="181.4653">2. Assert SHDN_REQ_L-O for ShdnReqPulseMs defined duration</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194" x="16" y="196.5981">Host Graceful Transition To Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="218" y="196.5981">psPowerOKDeAssert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="451" y="196.5981">Host Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221" x="653" y="196.5981">powerStateGracefulTransitionToOff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="882" y="196.5981">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="559" x="1215" y="196.5981">RUN_POWER_PG-I de-asserted so Graceful Shutdown sequence completed successfully:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217" x="1215" y="211.731">1. Cancel Graceful power-off timer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214" x="1215" y="226.8638">2. Stop SHDN_REQ_L-O assertion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194" x="16" y="241.9966">Host Graceful Transition To Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108" x="218" y="241.9966">powerOffRequest</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="451" y="241.9966">Host Power On</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221" x="653" y="241.9966">powerStateGracefulTransitionToOff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="882" y="241.9966">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="489" x="1215" y="241.9966">Graceful shutdown failed because of RUN_POWER_PG-I de-assertion timeout:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214" x="1215" y="257.1294">1. Stop SHDN_REQ_L-O assertion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="194" x="16" y="272.2622">Host Graceful Transition To Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="190" x="218" y="272.2622">gracefulPowerOffTimerExpired</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="451" y="272.2622">Host Wait For Shutdown Ok</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221" x="653" y="272.2622">powerStateGracefulTransitionToOff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98" x="882" y="272.2622">forcePowerOff()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="418" x="1215" y="272.2622">Received a Forceful Shutdown Request during Graceful Shutdown:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="214" x="1215" y="287.395">1. Stop SHDN_REQ_L-O assertion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217" x="1215" y="302.5278">2. Cancel Graceful power-off timer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207" x="1215" y="317.6606">3. Assert SHDN_FORCE_L-O to 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325" x="1215" y="332.7935">4. Start watchdog timer for SHDN_OK_L-I assertion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="16" y="347.9263">Host Wait For Shutdown Ok</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120" x="218" y="347.9263">shutdownOKAssert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="451" y="347.9263">Host Transition To Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183" x="653" y="347.9263">powerStateWaitForShutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="882" y="347.9263">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230" x="1215" y="347.9263">SHDN_OK_L-I asserted successfully:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336" x="1215" y="363.0591">1. Cancel watchdog timer for SHDN_OK_L-I assertion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203" x="1215" y="378.1919">2. De-assert RUN_POWER_EN-O</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="333" x="1215" y="393.3247">3. Start watchdog for RUN_POWER_PG-I to de-assert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="16" y="408.4575">Host Wait For Shutdown Ok</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225" x="218" y="408.4575">shutdownOKWatchdogTimerExpired</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="451" y="408.4575">Host Power On</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183" x="653" y="408.4575">powerStateWaitForShutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="882" y="408.4575">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438" x="1215" y="408.4575">Forceful shutdown failed because of SHDN_OK_L-I assertion timeout:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264" x="1215" y="423.5903">1. De-assert SHDN_FORCE_L-O (cleanup)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="16" y="438.7231">Host Wait For Shutdown Ok</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="218" y="438.7231">psPowerOKDeAssert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="451" y="438.7231">Host Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183" x="653" y="438.7231">powerStateWaitForShutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="882" y="438.7231">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385" x="1215" y="438.7231">Unexpected power loss during Forceful Shutdown Sequence:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200" x="1215" y="453.856">1. De-assert SHDN_FORCE_L-O</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382" x="1215" y="468.9888">2. De-assert RUN_POWER_EN-O to match RUN_POWER_PG-I</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="16" y="484.1216">Host Transition To Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="218" y="484.1216">psPowerOKDeAssert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="451" y="484.1216">Host Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191" x="653" y="484.1216">powerStateTransitionPowerOff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="882" y="484.1216">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="556" x="1215" y="484.1216">RUN_POWER_PG-I de-a