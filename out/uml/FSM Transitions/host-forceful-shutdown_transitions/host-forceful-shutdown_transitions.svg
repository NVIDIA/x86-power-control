<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="425px" preserveAspectRatio="none" style="width:1528px;height:425px;background:#FFFFFF;" version="1.1" viewBox="0 0 1528 425" width="1528px" zoomAndPan="magnify"><defs/><g><g id="HostPowerOff"><rect fill="#F1F1F1" height="50" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="185" x="671" y="7"/><line style="stroke:#181818;stroke-width:0.5;" x1="671" x2="856" y1="33.2969" y2="33.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="165" x="681" y="24.9951">Host Forceful Shutdown</text></g><g id="elem_GMN3"><path d="M6,117 L6,418.5234 A0,0 0 0 0 6,418.5234 L1521,418.5234 A0,0 0 0 0 1521,418.5234 L1521,127 L1511,117 L767.5,117 L763.5,57.16 L759.5,117 L6,117 A0,0 0 0 0 6,117 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1511,117 L1511,127 L1521,127 L1511,117 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="94" x="17" y="136.0669">Source State</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="41" x="204" y="136.0669">Event</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="92" x="437" y="136.0669">Target State</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="58" x="624" y="136.0669">Handler</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="114" x="823" y="136.0669">Action Function</text><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="84" x="947" y="136.0669">Description</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="16" y="151.1997">Host Power On</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="108" x="203" y="151.1997">powerOffRequest</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="436" y="151.1997">Host Wait For Shutdown Ok</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91" x="623" y="151.1997">powerStateOn</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="98" x="822" y="151.1997">forcePowerOff()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="275" x="946" y="151.1997">Host Forceful Shutdown Sequence Started:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207" x="946" y="166.3325">1. Assert SHDN_FORCE_L-O to 0</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="325" x="946" y="181.4653">2. Start watchdog timer for SHDN_OK_L-I assertion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="16" y="196.5981">Host Wait For Shutdown Ok</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="120" x="203" y="196.5981">shutdownOKAssert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="436" y="196.5981">Host Transition To Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183" x="623" y="196.5981">powerStateWaitForShutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="822" y="196.5981">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="230" x="946" y="196.5981">SHDN_OK_L-I asserted successfully:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336" x="946" y="211.731">1. Cancel watchdog timer for SHDN_OK_L-I assertion</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="203" x="946" y="226.8638">2. De-assert RUN_POWER_EN-O</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="305" x="946" y="241.9966">3. Start Power Supply Power Ok Watchdog timer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="16" y="257.1294">Host Wait For Shutdown Ok</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="225" x="203" y="257.1294">shutdownOKWatchdogTimerExpired</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="436" y="257.1294">Host Power On</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183" x="623" y="257.1294">powerStateWaitForShutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="822" y="257.1294">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="438" x="946" y="257.1294">Forceful shutdown failed because of SHDN_OK_L-I assertion timeout:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264" x="946" y="272.2622">1. De-assert SHDN_FORCE_L-O (cleanup)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="16" y="287.395">Host Wait For Shutdown Ok</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="203" y="287.395">psPowerOKDeAssert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="436" y="287.395">Host Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="183" x="623" y="287.395">powerStateWaitForShutdown</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="822" y="287.395">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="385" x="946" y="287.395">Unexpected power loss during Forceful Shutdown Sequence:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="200" x="946" y="302.5278">1. De-assert SHDN_FORCE_L-O</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="382" x="946" y="317.6606">2. De-assert RUN_POWER_EN-O to match RUN_POWER_PG-I</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="16" y="332.7935">Host Transition To Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="130" x="203" y="332.7935">psPowerOKDeAssert</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="436" y="332.7935">Host Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191" x="623" y="332.7935">powerStateTransitionPowerOff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="822" y="332.7935">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="556" x="946" y="332.7935">RUN_POWER_PG-I de-asserted so Forceful Shutdown sequence completed successfully:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="316" x="946" y="347.9263">1. Cancel Power Supply Power Ok Watchdog timer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264" x="946" y="363.0591">2. De-assert SHDN_FORCE_L-O (cleanup)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="179" x="16" y="378.1919">Host Transition To Power Off</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="217" x="203" y="378.1919">psPowerOKWatchdogTimerExpired</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="94" x="436" y="378.1919">Host Power On</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191" x="623" y="378.1919">powerStateTransitionPowerOff</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="36" x="822" y="378.1919">TBD()</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="526" x="946" y="378.1919">Forceful shutdown failed because Power Supply Power Ok Watchdog timer timeout:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264" x="946" y="393.3247">1. De-assert SHDN_FORCE_L-O (cleanup)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="360" x="946" y="408.4575">2. Assert RUN_POWER_EN-O to match RUN_POWER_PG-I</text><line style="stroke:#000000;stroke-width:0.5;" x1="12" x2="1506" y1="124" y2="124"/><line style="stroke:#000000;stroke-width:0.5;" x1="12" x2="1506" y1="139.1328" y2="139.1328"/><line style="stroke:#000000;stroke-width:0.5;" x1="12" x2="1506" y1="184.5313" y2="184.5313"/><line style="stroke:#000000;stroke-width:0.5;" x1="12" x2="1506" y1="245.0625" y2="245.0625"/><line style="stroke:#000000;stroke-widt